<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>好食麵館點餐</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600&display=swap">
<style>
/* 版面：左側菜單、右側訂單面板；手機為單欄，底部固定合計列 */
:root{
  --bg:#F6F7F5; --surface:#FFFFFF; --ink:#1C2320; --muted:#5E6A64; --line:#E1E6E2;
  --accent:#2D6A4F; --accent-ink:#FFFFFF; --accent-soft:#E6F0EA; --danger:#B3261E;
  --font-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --font-display:"Noto Serif TC","Songti TC","PMingLiU",serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101412; --surface:#171D1A; --ink:#E7ECE8; --muted:#9AA8A0; --line:#27302B;
    --accent:#6DB48F; --accent-ink:#0E1A14; --accent-soft:#1D2A23; --danger:#F2938C; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101412; --surface:#171D1A; --ink:#E7ECE8; --muted:#9AA8A0; --line:#27302B;
  --accent:#6DB48F; --accent-ink:#0E1A14; --accent-soft:#1D2A23; --danger:#F2938C; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.55;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* 店名 */
.site{padding-block:32px 20px}
.site h1{margin:0;font-family:var(--font-display);font-weight:600;font-size:1.9rem;letter-spacing:.06em;text-wrap:balance}
.site p{margin:6px 0 0;color:var(--muted);font-size:.95rem}

/* 分類列 */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);border-bottom:1px solid var(--line)}
.tabrow{display:flex;gap:8px;overflow-x:auto;padding-block:10px;scrollbar-width:none}
.tabrow::-webkit-scrollbar{display:none}
.tab{flex:none;border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 16px;min-height:38px;color:var(--muted);font-weight:500}
.tab[aria-current="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

/* 版面 */
.layout{display:grid;gap:32px;padding-block:8px 40px;grid-template-columns:minmax(0,1fr)}
@media (min-width:900px){
  .layout{grid-template-columns:minmax(0,1fr) 380px;gap:48px}
  .cart{position:sticky;top:calc(72px + env(safe-area-inset-top,0px));max-height:calc(100vh - 96px);overflow:auto}
  .bar{display:none!important}
  #orderForm .submit{position:sticky;bottom:0;box-shadow:0 0 0 10px var(--surface)}
}

/* 菜單 */
.cat{scroll-margin-top:calc(64px + env(safe-area-inset-top,0px));padding-top:20px}
.cat h2{margin:0;padding-bottom:8px;font-size:1.05rem;font-weight:700;letter-spacing:.08em;border-bottom:2px solid var(--ink)}
.list{list-style:none;margin:0;padding:0}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.name{font-weight:500;font-size:1.05rem}
.desc{color:var(--muted);font-size:.875rem;margin-top:2px}
.price{margin-top:2px;color:var(--accent);font-weight:700;font-variant-numeric:tabular-nums}
.ctl{min-width:88px;display:flex;justify-content:flex-end}
.add{border:1.5px solid var(--accent);background:transparent;color:var(--accent);border-radius:8px;padding:6px 20px;min-height:40px;font-weight:700}
.add:hover{background:var(--accent-soft)}
.step{display:inline-flex;align-items:center;border:1.5px solid var(--accent);border-radius:8px;overflow:hidden}
.step button{width:40px;height:38px;border:0;background:transparent;color:var(--accent);font-size:1.25rem;line-height:1}
.step button:hover{background:var(--accent-soft)}
.step output{min-width:32px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}

/* 訂單面板 */
.cart{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;scroll-margin-top:calc(64px + env(safe-area-inset-top,0px))}
.cart h2{margin:0 0 12px;font-size:1.15rem}
.cart-list{list-style:none;margin:0;padding:0}
.cart-list:focus{outline:none}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.row .sub{color:var(--muted);font-size:.875rem;font-variant-numeric:tabular-nums}
.empty{margin:0;padding:8px 0 4px;color:var(--muted);font-size:.95rem}
.total{display:flex;justify-content:space-between;align-items:baseline;margin:14px 0 0;padding-bottom:16px;border-bottom:1px solid var(--line)}
.total dt{font-weight:500}
.total dd{margin:0;font-size:1.35rem;font-weight:700;font-variant-numeric:tabular-nums}
form{display:grid;gap:14px;padding-top:16px}
.field{display:grid;gap:6px}
.field label{font-weight:500;font-size:.925rem}
.field .opt{color:var(--muted);font-weight:400}
.field input,.field textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:10px 12px;min-height:44px}
.field textarea{resize:vertical;min-height:72px}
.field input[aria-invalid="true"]{border-color:var(--danger)}
.err{margin:0;min-height:0;color:var(--danger);font-size:.875rem}
.err:empty{display:none}
.form-err{margin:0;color:var(--danger);font-size:.925rem}
.form-err:empty{display:none}
.submit{width:100%;border:0;background:var(--accent);color:var(--accent-ink);border-radius:8px;min-height:48px;font-weight:700;font-size:1.05rem;letter-spacing:.1em}
.submit:hover{filter:brightness(1.08)}
.ghost{width:100%;border:1.5px solid var(--accent);background:transparent;color:var(--accent);border-radius:8px;min-height:44px;font-weight:700}

/* 完成畫面 */
#done h2{outline:none}
.lead{margin:0 0 14px;color:var(--muted)}
.meta{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 16px;margin:0 0 8px;padding:12px 14px;background:var(--accent-soft);border-radius:8px}
.meta dt{color:var(--muted)}
.meta dd{margin:0;font-weight:700;overflow-wrap:anywhere}
.noteline{margin:12px 0 0;color:var(--muted);font-size:.925rem;overflow-wrap:anywhere}
.actions{display:grid;gap:10px;margin-top:18px}
#plain{width:100%;min-height:150px;margin-top:10px;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:10px;font-size:.875rem}

/* 手機底部合計列 */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--surface);border-top:1px solid var(--line);padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.bar span{font-variant-numeric:tabular-nums}
.bar b{font-size:1.1rem}
.bar button{border:0;background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:0 20px;min-height:44px;font-weight:700}
@media (max-width:899px){body.has-bar{padding-bottom:76px}}
@media (prefers-reduced-motion:no-preference){.add,.step button,.tab{transition:background-color .15s}}
</style>
</head>
<body>
<header class="site"><div class="wrap">
  <h1>好食麵館</h1>
  <p>請選擇餐點，填寫桌號與電話後送出訂單。價格單位為新台幣。</p>
</div></header>

<nav class="tabs" aria-label="菜單分類"><div class="wrap"><div class="tabrow" id="tabs"></div></div></nav>

<main class="wrap layout">
  <div id="menu"></div>

  <aside class="cart" id="cart" aria-labelledby="cartTitle">
    <div id="orderPane">
      <h2 id="cartTitle">您的訂單</h2>
      <ul class="cart-list" id="cartList" tabindex="-1"></ul>
      <p class="empty" id="cartEmpty">尚未加入餐點，請從菜單點選「加入」。</p>
      <dl class="total"><dt>合計</dt><dd id="total">NT$0</dd></dl>

      <form id="orderForm" novalidate>
        <div class="field">
          <label for="table">桌號</label>
          <input id="table" name="table" type="text" maxlength="6" autocomplete="off" placeholder="例如 8 或 A3" aria-describedby="tableErr">
          <p class="err" id="tableErr"></p>
        </div>
        <div class="field">
          <label for="phone">聯絡電話</label>
          <input id="phone" name="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="例如 0912345678" aria-describedby="phoneErr">
          <p class="err" id="phoneErr"></p>
        </div>
        <div class="field">
          <label for="note">備註 <span class="opt">（選填）</span></label>
          <textarea id="note" name="note" maxlength="100" placeholder="例如：牛肉麵不要蔥"></textarea>
        </div>
        <p class="form-err" id="formErr" role="alert"></p>
        <button type="submit" class="submit">送出訂單</button>
      </form>
    </div>

    <div id="done" hidden></div>
  </aside>
</main>

<div class="bar" id="bar" hidden>
  <span><b id="barN">0</b> 項　<b id="barT">NT$0</b></span>
  <button type="button" id="barGo">查看訂單</button>
</div>

<script>
/* 菜單資料：在這裡修改菜名、價格與說明 */
const MENU=[
  {id:'noodle',name:'麵類',items:[
    {id:'n1',name:'紅燒牛肉麵',price:180,desc:'牛腱與牛筋，湯頭濃郁'},
    {id:'n2',name:'清燉牛肉麵',price:180,desc:'清甜牛骨湯，搭配白蘿蔔'},
    {id:'n3',name:'麻醬乾麵',price:80,desc:'芝麻醬拌手工麵，附小菜'},
    {id:'n4',name:'陽春麵',price:60}
  ]},
  {id:'rice',name:'飯類',items:[
    {id:'r1',name:'滷肉飯',price:45,desc:'小碗'},
    {id:'r2',name:'雞肉飯',price:50,desc:'小碗'},
    {id:'r3',name:'控肉飯',price:90,desc:'軟嫩五花肉，附酸菜'}
  ]},
  {id:'side',name:'小菜',items:[
    {id:'s1',name:'滷蛋',price:15},
    {id:'s2',name:'涼拌小黃瓜',price:50},
    {id:'s3',name:'皮蛋豆腐',price:60},
    {id:'s4',name:'燙青菜',price:50,desc:'依當日蔬菜供應'}
  ]},
  {id:'drink',name:'飲料',items:[
    {id:'d1',name:'冬瓜茶',price:30},
    {id:'d2',name:'無糖綠茶',price:30},
    {id:'d3',name:'紅茶',price:30},
    {id:'d4',name:'熱豆漿',price:35}
  ]}
];

const $=s=>document.querySelector(s);
const NT=n=>'NT$'+n.toLocaleString('en-US');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ITEMS=new Map();
MENU.forEach(c=>c.items.forEach(i=>ITEMS.set(i.id,i)));
const cart=new Map();
let cartInView=false;
const MAX_QTY=20;
/* 訂單 POST 的目標網址（n8n Webhook） */
const WEBHOOK_URL='https://n8n-production-5433.up.railway.app/webhook/178acf4a-55f8-4338-bb75-5c238b3634bf';
let sending=false;
const smooth=matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth';

function ctlHTML(it){
  const q=cart.get(it.id)||0;
  if(!q) return `<button type="button" class="add" data-act="inc" aria-label="加入${esc(it.name)}">加入</button>`;
  return `<div class="step"><button type="button" data-act="dec" aria-label="減少${esc(it.name)}">−</button><output aria-label="${esc(it.name)}數量">${q}</output><button type="button" data-act="inc" aria-label="增加${esc(it.name)}">+</button></div>`;
}

/* 繪製菜單與分類列 */
$('#menu').innerHTML=MENU.map(c=>`
  <section class="cat" id="cat-${c.id}" aria-labelledby="h-${c.id}">
    <h2 id="h-${c.id}">${c.name}</h2>
    <ul class="list">${c.items.map(i=>`
      <li class="item">
        <div class="info">
          <div class="name">${i.name}</div>
          ${i.desc?`<div class="desc">${i.desc}</div>`:''}
          <div class="price">${NT(i.price)}</div>
        </div>
        <div class="ctl" data-id="${i.id}">${ctlHTML(i)}</div>
      </li>`).join('')}
    </ul>
  </section>`).join('');

$('#tabs').innerHTML=MENU.map(c=>`<button type="button" class="tab" data-target="cat-${c.id}" data-tab="${c.id}">${c.name}</button>`).join('');
function setActive(id){document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-current',String(t.dataset.tab===id)))}
setActive(MENU[0].id);
$('#tabs').addEventListener('click',e=>{
  const b=e.target.closest('.tab'); if(!b) return;
  document.getElementById(b.dataset.target).scrollIntoView({behavior:smooth,block:'start'});
});
if('IntersectionObserver' in window){
  const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting) setActive(e.target.id.slice(4))}),{rootMargin:'-20% 0px -70% 0px'});
  document.querySelectorAll('.cat').forEach(s=>io.observe(s));
}

/* 購物車 */
function totals(){let n=0,t=0;cart.forEach((q,id)=>{n+=q;t+=q*ITEMS.get(id).price});return{n,t}}

function renderCart(){
  const {n,t}=totals();
  $('#cartList').innerHTML=[...cart].map(([id,q])=>{
    const it=ITEMS.get(id);
    return `<li class="row" data-id="${id}">
      <div><div class="name">${it.name}</div><div class="sub">${NT(it.price)} × ${q} = ${NT(it.price*q)}</div></div>
      <div>${ctlHTML(it)}</div></li>`;
  }).join('');
  $('#cartEmpty').hidden=n>0;
  $('#total').textContent=NT(t);
  $('#barN').textContent=n;
  $('#barT').textContent=NT(t);
  updateBar();
}

function updateBar(){
  const active=totals().n>0&&$('#done').hidden;
  document.body.classList.toggle('has-bar',active);
  $('#bar').hidden=!(active&&!cartInView);
}
if('IntersectionObserver' in window){
  new IntersectionObserver(es=>{cartInView=es[0].isIntersecting;updateBar()},{threshold:0.01}).observe($('#cart'));
}

function change(id,d,from){
  const q=Math.max(0,Math.min(MAX_QTY,(cart.get(id)||0)+d));
  q?cart.set(id,q):cart.delete(id);
  const it=ITEMS.get(id);
  document.querySelectorAll(`.ctl[data-id="${id}"]`).forEach(el=>el.innerHTML=ctlHTML(it));
  renderCart();
  $('#formErr').textContent='';
  const act=d>0?'inc':'dec';
  let target=null;
  if(from==='menu') target=document.querySelector(`.ctl[data-id="${id}"] [data-act="${q?act:'inc'}"]`);
  else target=document.querySelector(`#cartList li[data-id="${id}"] [data-act="${act}"]`)||$('#cartList');
  if(target) target.focus({preventScroll:true});
}

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b) return;
  const host=b.closest('[data-id]'); if(!host) return;
  change(host.dataset.id,b.dataset.act==='inc'?1:-1,host.classList.contains('ctl')?'menu':'cart');
});
$('#barGo').addEventListener('click',()=>$('#cart').scrollIntoView({behavior:smooth,block:'start'}));

/* 送出訂單 */
const form=$('#orderForm');
function setErr(input,errEl,msg){
  errEl.textContent=msg||'';
  if(msg) input.setAttribute('aria-invalid','true'); else input.removeAttribute('aria-invalid');
}
['table','phone'].forEach(k=>$('#'+k).addEventListener('input',()=>setErr($('#'+k),$('#'+k+'Err'),'')));

form.addEventListener('submit',async e=>{
  e.preventDefault();
  if(sending) return;
  const tableEl=$('#table'),phoneEl=$('#phone');
  const table=tableEl.value.trim();
  const phone=phoneEl.value.replace(/[\s-]/g,'');
  $('#formErr').textContent='';
  setErr(tableEl,$('#tableErr'),'');
  setErr(phoneEl,$('#phoneErr'),'');
  if(!cart.size){$('#formErr').textContent='請先從菜單加入餐點。';return}
  let first=null;
  if(!table){setErr(tableEl,$('#tableErr'),'請填寫桌號。');first=first||tableEl}
  if(!/^0\d{8,9}$/.test(phone)){setErr(phoneEl,$('#phoneErr'),'請輸入正確的電話號碼，例如 0912345678。');first=first||phoneEl}
  if(first){first.focus();return}

  const lines=[...cart].map(([id,q])=>{const it=ITEMS.get(id);return{name:it.name,qty:q,price:it.price,sub:it.price*q}});
  const order={
    no:String(Math.floor(Math.random()*9000)+1000),
    table,phone:$('#phone').value.trim(),note:$('#note').value.trim(),
    lines,total:totals().t
  };
  const btn=form.querySelector('.submit');
  sending=true;btn.disabled=true;btn.textContent='送出中…';
  try{
    await sendOrder(order);
    showDone(order);
  }catch(err){
    console.error('送出訂單失敗',err);
    const m=/^HTTP (\d+)/.exec((err&&err.message)||'');
    $('#formErr').textContent='訂單送出失敗'+(m?'（伺服器回應 '+m[1]+'）':'（無法連線到訂單伺服器）')+'，請稍後再試或請服務人員協助。';
  }finally{
    sending=false;btn.disabled=false;btn.textContent='送出訂單';
  }
});

/* 以 HTTP POST（JSON）把訂單送到 Webhook */
async function sendOrder(o){
  const ctrl=new AbortController();
  const timer=setTimeout(()=>ctrl.abort(),15000);
  try{
    const res=await fetch(WEBHOOK_URL,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        orderNo:o.no,
        table:o.table,
        phone:o.phone,
        items:o.lines.map(l=>({name:l.name,quantity:l.qty,unitPrice:l.price,subtotal:l.sub})),
        total:o.total,
        note:o.note,
        createdAt:new Date().toISOString()
      }),
      signal:ctrl.signal
    });
    if(!res.ok) throw new Error('HTTP '+res.status);
  }finally{clearTimeout(timer)}
}

function orderText(o){
  return ['好食麵館 訂單 #'+o.no,'桌號：'+o.table,'電話：'+o.phone,'']
    .concat(o.lines.map(l=>`${l.name} × ${l.qty}　${NT(l.sub)}`))
    .concat(['','合計：'+NT(o.total)],o.note?['備註：'+o.note]:[]).join('\n');
}

function showDone(o){
  $('#done').innerHTML=`
    <h2 id="doneTitle" tabindex="-1">訂單已送出</h2>
    <p class="lead">店家已收到您的訂單，請稍候。如需更改請告知服務人員。</p>
    <dl class="meta">
      <dt>訂單編號</dt><dd>#${esc(o.no)}</dd>
      <dt>桌號</dt><dd>${esc(o.table)}</dd>
      <dt>電話</dt><dd>${esc(o.phone)}</dd>
    </dl>
    <ul class="cart-list">${o.lines.map(l=>`<li class="row"><div class="name">${esc(l.name)} × ${l.qty}</div><div class="sub">${NT(l.sub)}</div></li>`).join('')}</ul>
    <dl class="total"><dt>合計</dt><dd>${NT(o.total)}</dd></dl>
    ${o.note?`<p class="noteline">備註：${esc(o.note)}</p>`:''}
    <div class="actions">
      <button type="button" class="ghost" id="copyBtn">複製訂單明細</button>
      <button type="button" class="submit" id="againBtn">繼續點餐</button>
    </div>
    <textarea id="plain" readonly hidden aria-label="訂單明細"></textarea>`;
  cart.clear();
  document.querySelectorAll('.ctl').forEach(el=>el.innerHTML=ctlHTML(ITEMS.get(el.dataset.id)));
  $('#orderPane').hidden=true;
  $('#done').hidden=false;
  renderCart();
  $('#cart').scrollIntoView({behavior:smooth,block:'start'});
  $('#doneTitle').focus({preventScroll:true});

  $('#copyBtn').addEventListener('click',async()=>{
    const txt=orderText(o),btn=$('#copyBtn');
    try{
      await navigator.clipboard.writeText(txt);
      btn.textContent='已複製';
    }catch(_){
      const ta=$('#plain');ta.value=txt;ta.hidden=false;ta.focus();ta.select();
      btn.textContent='請長按選取並複製下方文字';
    }
  });
  $('#againBtn').addEventListener('click',()=>{
    $('#done').hidden=true;
    $('#done').innerHTML='';
    $('#orderPane').hidden=false;
    $('#note').value='';
    renderCart();
    document.querySelector('.tabs').scrollIntoView({behavior:smooth,block:'start'});
  });
}

renderCart();
</script>
</body>
</html>
